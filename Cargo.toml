[package]
name = "xmip-core-authorize-abac"
version.workspace = true
edition.workspace = true
license.workspace = true
repository = "https://github.com/IlleNilsson/xmip-core-authorize-abac"
description = "Attribute-based authorization: rules that permit or deny where a condition in Xmip's one expression language holds over attributes of the identity's facts and the attempt. A xmip-core-authorize technology."
publish.workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
# A Technology depends on its parent Capability, never the reverse
# (repository-model.md). The facts it judges are context's and the layer it
# answers for is core's; a rule's condition is written in Xmip's one
# expression language, a capability of its own (ADR-0066 clause 2;
# amendment 2026-11-28); standard library
# otherwise.
authorize = { workspace = true }
context = { workspace = true }
expression = { workspace = true }
xcore = { workspace = true }

[lints]
workspace = true
